<div class="date-field">
  <!-- Readonly display: Plain text without picker -->
  <div *ngIf="isFieldReadOnly()" class="readonly-field">
    <label *ngIf="shouldShowLabel() && getFieldLabel()"
           class="field-label"
           [attr.id]="'date-label-' + field.name">
      {{ getFieldLabel() }}
      <span *ngIf="isFieldRequired() && !config?.hideRequiredIndicator" class="required-asterisk" aria-hidden="true">*</span>
    </label>
    <div class="readonly-value"
         role="status"
         [attr.aria-labelledby]="'date-label-' + field.name">
      {{ isSecured() && getFormattedDateValue() ? '••••••••' : (getFormattedDateValue() || 'No date selected') }}
    </div>

    <span *ngIf="getTimezone()" class="timezone-caption">{{ getTimezone() }}</span>

  </div>

  <!-- Editable display: Custom date picker input -->
  <div *ngIf="!isFieldReadOnly()" class="date-input-container">
    <label *ngIf="shouldShowLabel() && getFieldLabel()"
           class="field-label"
           [attr.for]="'date-input-' + field.name"
           [attr.id]="'date-label-edit-' + field.name">
      {{ getFieldLabel() }}
      <span *ngIf="isFieldRequired() && !config?.hideRequiredIndicator" class="required-asterisk" aria-hidden="true">*</span>
    </label>

    <div class="date-input-wrapper"
         [class.has-error]="config.hasError"
         (click)="openDatePicker()"
         (keydown.enter)="openDatePicker()"
         (keydown.space)="openDatePicker(); $event.preventDefault()">
      <input
        type="text"
        class="date-input"
        [attr.id]="'date-input-' + field.name"
        [value]="isSecured() && getFormattedDateValue() ? '••••••••' : getFormattedDateValue()"
        [placeholder]="getPlaceholder()"
        readonly
        [attr.aria-invalid]="config.hasError"
        [attr.aria-required]="isFieldRequired()"
        [attr.aria-describedby]="config.hasError ? 'date-error-edit-' + field.name : null"
        [attr.aria-label]="'Select date for ' + (field.displayName || field.name)">

      <!-- Clear button (shown when date is selected) -->
      <button *ngIf="field.value"
              type="button"
              class="clear-button"
              (click)="clearDate($event)"
              (keydown.enter)="clearDate($event)"
              (keydown.space)="clearDate($event)"
              [attr.aria-label]="'Clear date for ' + (field.displayName || field.name)"
              tabindex="0">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <span class="calendar-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </span>
    </div>

    <span *ngIf="getTimezone()" class="timezone-caption">{{ getTimezone() }}</span>

    <!-- Error message -->
    <div class="fallback-error-message"
         [style.visibility]="config.hasError && config.errorMessage ? 'visible' : 'hidden'"
         role="alert"
         [attr.id]="'date-error-edit-' + field.name">
      {{ config.errorMessage }}
    </div>
  </div>
</div>
