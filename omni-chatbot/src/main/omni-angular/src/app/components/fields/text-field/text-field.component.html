<div class="text-field">
  <!-- Readonly display: Plain text without input styling -->
  <div *ngIf="isFieldReadOnly()" class="readonly-field">
    <label *ngIf="shouldShowLabel() && getFieldLabel()"
           class="field-label"
           [attr.id]="'text-label-' + field.name">
      {{ getFieldLabel() }}
      <span *ngIf="isFieldRequired() && !config?.hideRequiredIndicator" class="required-asterisk" aria-hidden="true">*</span>
    </label>
    <div class="readonly-value"
         [class.paragraph]="field.fieldType === 'com.krista.fields.Paragraph'"
         role="status"
         [attr.aria-labelledby]="'text-label-' + field.name">
      {{ isSecured() && getDisplayValue() ? '••••••••' : getDisplayValue() }}
    </div>

  </div>

  <!-- Editable display: Material form field with textarea (matches original multiline behavior) -->
  <mat-form-field *ngIf="!isFieldReadOnly()" appearance="fill" class="full-width krista-field" [class.mat-form-field-invalid]="config.hasError">
    <mat-label *ngIf="shouldShowLabel() && getFieldLabel()">
      {{ getFieldLabel() }}
      <span *ngIf="isFieldRequired() && !config?.hideRequiredIndicator" class="required-asterisk" aria-hidden="true">*</span>
    </mat-label>

    <!-- Secured text fields use password input to mask values -->
    <input
      *ngIf="isSecured()"
      matInput
      type="password"
      [attr.id]="'text-input-' + field.name"
      [value]="getDisplayValue()"
      [placeholder]="getPlaceholder()"
      [attr.aria-invalid]="config.hasError"
      [attr.aria-required]="isFieldRequired()"
      [attr.aria-describedby]="config.hasError ? 'text-error-edit-' + field.name : null"
      autocomplete="off"
      (input)="onValueChange($any($event.target).value)"
      (blur)="onBlur($any($event.target).value)"
      (focus)="onFocus()"
      (keypress)="onKeyPress($event)"
      [class.error]="config.hasError"
      [class.ng-invalid]="config.hasError"
      [class.ng-touched]="config.hasError">

    <!-- Non-secured text fields use textarea with auto-resize (matches original multiline behavior) -->
    <textarea
      *ngIf="!isSecured()"
      #autoTextarea
      matInput
      cdkTextareaAutosize
      [cdkAutosizeMinRows]="getMinRows()"
      [cdkAutosizeMaxRows]="getMaxRows()"
      [class.is-scrollable]="isScrollable"
      [attr.id]="'text-input-' + field.name"
      [attr.type]="getInputType()"
      [value]="getDisplayValue()"
      [placeholder]="getPlaceholder()"
      [attr.aria-invalid]="config.hasError"
      [attr.aria-required]="isFieldRequired()"
      [attr.aria-describedby]="config.hasError ? 'text-error-edit-' + field.name : null"
      [autocapitalize]="getAutoCapitalize()"
      autocomplete="off"
      [attr.inputmode]="getInputType() === 'tel' ? 'tel' : 'text'"
      (input)="onValueChange($any($event.target).value)"
      (blur)="onBlur($any($event.target).value)"
      (focus)="onFocus()"
      (keydown)="onKeyDown($event)"
      (keypress)="onKeyPress($event)"
      [class.error]="config.hasError"
      [class.ng-invalid]="config.hasError"
      [class.ng-touched]="config.hasError">
    </textarea>

    <!-- Error message using mat-error (inside form field) -->
    <mat-error *ngIf="config.hasError && config.errorMessage" [attr.id]="'text-error-edit-' + field.name">
      {{ config.errorMessage }}
    </mat-error>
  </mat-form-field>

  <!-- Fallback error message outside form field for editable -->
  <div *ngIf="!isFieldReadOnly()"
       class="fallback-error-message"
       [style.visibility]="config.hasError && config.errorMessage ? 'visible' : 'hidden'"
       role="alert"
       [attr.id]="'text-error-fallback-' + field.name">
    {{ config.errorMessage }}
  </div>
</div>
