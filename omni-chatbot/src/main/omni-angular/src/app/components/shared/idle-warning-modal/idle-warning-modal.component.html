<div class="idle-overlay" role="dialog" aria-modal="true" aria-labelledby="idle-warning-title" aria-describedby="idle-warning-desc">
  <div class="idle-modal">
    <div class="idle-header">
      <div class="idle-icon" aria-hidden="true">
        <span class="idle-icon-inner">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="var(--krista-primary, #0169BE)" stroke-width="2"/>
            <line x1="12" y1="11" x2="12" y2="16.5" stroke="var(--krista-primary, #0169BE)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="7.75" r="1.25" fill="var(--krista-primary, #0169BE)"/>
          </svg>
        </span>
      </div>
      <h2 id="idle-warning-title" class="idle-title">
        {{ 'concurrency.idleWarning.title' | translate }}
      </h2>
    </div>
    <p id="idle-warning-desc" class="idle-message">
      {{ 'concurrency.idleWarning.message' | translate }}
    </p>
    <div class="idle-countdown" aria-live="polite" aria-atomic="true">
      <svg class="idle-countdown-ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="46"></circle>
        <circle
          class="ring-progress"
          cx="50"
          cy="50"
          r="46"
          [style.stroke-dasharray]="circumference"
          [style.stroke-dashoffset]="dashOffset"></circle>
      </svg>
      <div class="idle-countdown-content">
        <span class="countdown-number">{{ countdownSeconds }}</span>
        <span class="countdown-label">{{ 'concurrency.idleWarning.secondsLabel' | translate }}</span>
      </div>
    </div>
    <button
      class="still-here-btn"
      type="button"
      (click)="onStillHere()"
      [attr.aria-label]="'concurrency.idleWarning.stillHereBtnAria' | translate">
      {{ 'concurrency.idleWarning.stillHereBtn' | translate }}
    </button>
  </div>
</div>
