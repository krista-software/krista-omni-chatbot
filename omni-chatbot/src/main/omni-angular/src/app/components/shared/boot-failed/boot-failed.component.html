<div class="disconnected-overlay" role="alertdialog" aria-modal="true" aria-labelledby="boot-failed-title" aria-describedby="boot-failed-desc">
  <div class="disconnected-modal">
    <div class="disconnected-header">
      <div class="disconnected-icon" aria-hidden="true">
        <span class="disconnected-icon-inner">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="var(--krista-primary, #0169BE)" stroke-width="2"/>
            <path d="M12 7.5 V13" stroke="var(--krista-primary, #0169BE)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="16.25" r="1.1" fill="var(--krista-primary, #0169BE)"/>
          </svg>
        </span>
      </div>
      <h2 id="boot-failed-title" class="disconnected-title">{{ 'bootFailed.title' | translate }}</h2>
    </div>
    <p id="boot-failed-desc" class="disconnected-message">{{ 'bootFailed.message' | translate }}</p>
    <button
      class="reconnect-btn"
      type="button"
      (click)="onRetry()"
      [attr.aria-label]="'bootFailed.retryBtnAria' | translate">
      {{ 'bootFailed.retryBtn' | translate }}
    </button>
    <button
      class="close-btn"
      type="button"
      (click)="onClose()"
      [attr.aria-label]="'bootFailed.closeBtnAria' | translate">
      {{ 'bootFailed.closeBtn' | translate }}
    </button>
  </div>
</div>
