<!-- Footer Component -->
<!-- NOTE: The Integration Settings page renders a static replica of this footer
     ("Live Preview" in src/main/resources/integration/index.html). If you change
     the visual structure here, update that preview to match. -->
<footer class="footer-container" role="contentinfo">
  <!-- Message Input Area. Hidden entirely when the send box is disabled by config
       (hideSendMessage) OR the session has ended / an Ask form is active (hideFooter,
       set irreversibly on session timeout). The condition must be on THIS outer div: it
       previously sat only on the inner input-container, which left an empty
       .message-input-area strip behind — and .footer-container:has(.message-input-area)
       then kept forcing the 100px min-height after the session had timed out.
       A status-inform step does NOT hide the input: it only disables it (isStatusMode), so
       the input stays mounted and greys out — no layout shift, no flicker. -->
  <div class="message-input-area" *ngIf="!hideSendMessage && !hideFooter">
    <div class="input-container">
      <app-text-input-area
        [placeholder]="'footer.sendMessage'"
        [value]="value"
        [disabled]="isStatusMode"
        (valueChange)="setValue($event)"
        (enterKeyPress)="handleSendBtnClick()">
      </app-text-input-area>

      <button
        mat-icon-button
        color="primary"
        type="button"
        class="send-button"
        (click)="handleSendBtnClick()"
        [disabled]="isDisabled"
        aria-label="Send message">
        <svg
          class="send-icon"
          [class.disabled]="isDisabled"
          viewBox="0 0 20 20"
          width="20"
          height="20"
          fill="currentColor"
          aria-hidden="true"
          focusable="false">
          <path d="M5.6 10.7391L14.4 4.95652L7.2 14.0435V18.1739L10.4 14.8696L16 19L20 0L0 6.6087L5.6 10.7391Z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Footer Branding -->
  <div class="footer-branding">
    <div class="branding-content">
      <!-- Centered Powered by Krista -->
      <div class="powered-by-container">
        <span class="powered-by-text">{{ 'footer.poweredBy' | translate }}</span>
        <img src="/assets/images/krista-logo.svg" alt="Krista" class="krista-logo">
      </div>

      <!-- Terms & Conditions Link (positioned absolutely on right) -->
      <div class="terms-container" *ngIf="showTermsAndConditions">
        <a
          [href]="termsAndConditionsUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="terms-link">
          {{ customTermsLabel || ('footer.termsAndConditions' | translate) }}
        </a>
      </div>
    </div>
  </div>
</footer>
